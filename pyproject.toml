[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi-tissue-mask"
version = "0.1.0"
description = "HSV and Otsu tissue masking for whole-slide image patch planning"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhishek Thakur", email = "a.thakur5690@gmail.com"}]
requires-python = ">=3.9"
keywords = ["digital-pathology", "tissue-segmentation", "whole-slide-image", "WSI"]
dependencies = ["numpy>=1.24.0", "opencv-python>=4.8.0", "Pillow>=10.0.0", "openslide-python>=1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
